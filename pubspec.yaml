name: rebuysell_customer_app
description: "ReBuySell Customer trade-in pricing and booking portal mobile application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.5
  http: ^1.1.0
  connectivity_plus: ^4.0.2
  google_fonts: ^6.1.0
  shared_preferences: 2.2.2

dependency_overrides:
  path_provider_android: 2.2.19
  path_provider_foundation: 2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
